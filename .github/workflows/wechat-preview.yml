name: WeChat preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ${{ vars.WECHAT_PREVIEW_RUNNER || 'ubuntu-latest' }}
    environment: wechat-preview
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
        env:
          SCANNER_API_BASE_URL: ${{ vars.SCANNER_API_BASE_URL }}
      - name: Install WeChat CLI
        run: |
          npm install --prefix "$RUNNER_TEMP/wechat-ci" --no-audit --no-fund miniprogram-ci@2.1.31
          "$RUNNER_TEMP/wechat-ci/node_modules/.bin/miniprogram-ci" --help
      - name: Generate preview QR code
        env:
          WECHAT_APP_ID: ${{ vars.WECHAT_APP_ID }}
          WECHAT_UPLOAD_KEY: ${{ secrets.WECHAT_UPLOAD_KEY }}
        run: bash scripts/wechat-preview.sh
      - name: Save preview QR code
        id: qr
        uses: actions/upload-artifact@v6
        with:
          name: wechat-preview-${{ github.sha }}
          path: ${{ runner.temp }}/wechat-preview/preview.jpg
          if-no-files-found: error
          retention-days: 3
      - name: Link QR code in run summary
        env:
          ARTIFACT_URL: ${{ steps.qr.outputs.artifact-url }}
        run: |
          printf '预览版本 `%s`\n\n[下载二维码](%s)\n' "$GITHUB_SHA" "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
